{{- $c := dict "root" . "component" "redis" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "epickem.host" $c }}
  labels: {{- include "epickem.labels" . | nindent 4 }}
spec:
  selector: {{- include "epickem.selector" $c | nindent 4 }}
  ports:
    - { name: redis, port: 6379, targetPort: 6379 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "epickem.host" $c }}
  labels: {{- include "epickem.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "epickem.selector" $c | nindent 6 }}
  template:
    metadata:
      labels: {{- include "epickem.selector" $c | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          # Cache seulement (exports, réponses des sources externes) : pas de persistance.
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            exec: { command: [redis-cli, ping] }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 6379 }
            periodSeconds: 20
          resources: {{- toYaml .Values.redis.resources | nindent 12 }}
