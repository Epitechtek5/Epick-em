[package]
name = "api-public"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
actix-web = { version = "4", default-features = false, features = ["macros"] }
argon2 = "0.5"
async-trait = "0.1"
domain.workspace = true
infra.workspace = true
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid"] }
utoipa = { version = "6.0.0", features = ["uuid", "actix_extras"] }
utoipa-actix-web = "0.2.0"
utoipa-swagger-ui = { version = "10.0.2", features = ["actix-web", "vendored"] }
uuid = { version = "1", features = ["v4", "serde"] }

[lints]
workspace = true

[dev-dependencies]
actix-http = "3"
tokio = { version = "1", features = ["time", "rt", "macros", "net", "io-util"] }
