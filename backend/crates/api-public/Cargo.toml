[package]
name = "api-public"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
argon2 = "0.5"
async-trait = "0.1"
axum = "0.8"
domain.workspace = true
infra.workspace = true
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
utoipa = { version = "6.0.0", features = ["uuid", "axum_extras"] }
utoipa-axum = "0.3.0"
utoipa-swagger-ui = { version = "10.0.2", features = ["axum", "vendored"] }
uuid = { version = "1", features = ["v4", "serde"] }

[lints]
workspace = true

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["time", "rt", "macros"] }
tower = { version = "0.5", features = ["util"] }
