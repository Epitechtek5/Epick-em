name: Release

# 1. Uniquement au lancement manuel (Actions → Release → Run workflow) :
#    semantic-release analyse les commits (Conventional Commits) et, s'il y a lieu,
#    met à jour CHANGELOG.md et les versions (Cargo, Helm), les committe sur main
#    au nom de semantic-release-bot, puis crée le tag vX.Y.Z et la GitHub Release.
#    Le push passe par la deploy key « epickem-semantic-release » (secret
#    RELEASE_DEPLOY_KEY), autorisée à contourner la protection de main.
# 2. À chaque push sur main et à chaque lancement manuel : une image par service
#    est publiée sur GHCR, taguée avec le SHA du commit et, si une version vient
#    d'être créée, avec la version semver.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  semantic-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: release
        env:
          # API GitHub (release, commentaires) : github-actions[bot] ; git push : deploy key
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: semantic-release-bot
          GIT_AUTHOR_EMAIL: semantic-release-bot@martynus.net
          GIT_COMMITTER_NAME: semantic-release-bot
          GIT_COMMITTER_EMAIL: semantic-release-bot@martynus.net
        run: >
          npx --yes
          -p semantic-release@25.0.9
          -p @semantic-release/exec@7.1.0
          -p @semantic-release/changelog@7.0.0
          -p @semantic-release/git@11.0.1
          -p conventional-changelog-conventionalcommits@8
          semantic-release

  image:
    needs: semantic-release
    # semantic-release est sauté sur un simple push : publier quand même les images
    if: ${{ !cancelled() && needs.semantic-release.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: api-public, context: backend, bin: api-public }
          - { name: api-internal, context: backend, bin: api-internal }
          - { name: simulator, context: backend, bin: simulator }
          - { name: migrations, context: db }
    steps:
      # Après une release, construire depuis le tag pour embarquer les manifestes à jour
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.semantic-release.outputs.version && format('v{0}', needs.semantic-release.outputs.version) || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ needs.semantic-release.outputs.version }},enable=${{ needs.semantic-release.outputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.semantic-release.outputs.version }},enable=${{ needs.semantic-release.outputs.version != '' }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.bin && format('BIN={0}', matrix.bin) || '' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
