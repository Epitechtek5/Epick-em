name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      db: ${{ steps.filter.outputs.db }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/backend.yml'
            db:
              - 'db/**'
              - '.github/workflows/db.yml'
            web:
              - 'web/**'
              - '.github/workflows/web.yml'
            mobile:
              - 'mobile/**'
              - '.github/workflows/mobile.yml'
            deploy:
              - 'deploy/**'
              - '.github/workflows/deploy.yml'

  # Toujours exécuté, sur tout l'historique : aucun secret ne doit entrer dans le dépôt (ADR-007).
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rechercher des secrets
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --no-banner --redact -v

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/backend.yml

  db:
    needs: changes
    if: needs.changes.outputs.db == 'true'
    uses: ./.github/workflows/db.yml

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/web.yml

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    uses: ./.github/workflows/mobile.yml

  deploy:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    uses: ./.github/workflows/deploy.yml

  # Seul check requis par la protection de branche : stable quels que soient les chemins modifiés.
  ci-ok:
    if: always()
    needs: [changes, gitleaks, backend, db, web, mobile, deploy]
    runs-on: ubuntu-latest
    steps:
      # Liste blanche : tout résultat autre que ceux attendus fait échouer ci-ok
      # (échec, annulation, job jamais terminé, composant modifié mais non testé…).
      - name: Vérifier le résultat de chaque job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          result() { jq -r --arg j "$1" '.[$j].result' <<<"$NEEDS"; }
          ok=true

          for job in changes gitleaks; do
            r=$(result "$job")
            echo "$job : $r"
            [ "$r" = success ] || { echo "::error::$job doit réussir (résultat : $r)"; ok=false; }
          done

          for job in backend db web mobile deploy; do
            r=$(result "$job")
            changed=$(jq -r --arg j "$job" '.changes.outputs[$j]' <<<"$NEEDS")
            echo "$job : $r (modifié : $changed)"
            if [ "$changed" = true ]; then
              [ "$r" = success ] || { echo "::error::$job est modifié et doit réussir (résultat : $r)"; ok=false; }
            else
              [ "$r" = skipped ] || { echo "::error::$job non modifié, résultat inattendu : $r"; ok=false; }
            fi
          done

          $ok
