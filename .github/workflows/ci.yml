name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changed Components
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      db: ${{ steps.filter.outputs.db }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Classify changed components
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'db/**'
              - '.github/workflows/backend.yml'
            db:
              - 'db/**'
              - '.github/workflows/db.yml'
            web:
              - 'web/**'
              - '.github/workflows/web.yml'
            mobile:
              - 'mobile/**'
              - '.github/workflows/mobile.yml'
              - '.github/workflows/mobile-builds.yml'
              - '.github/workflows/release.yml'
              - '.github/workflows/ci.yml'
            deploy:
              - 'deploy/**'
              - '.github/workflows/deploy.yml'

  # Scan the entire history on every run to enforce ADR-007.
  gitleaks:
    name: Scan Git History for Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --no-banner --redact -v

  backend:
    name: Backend — Build & Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/backend.yml

  db:
    name: Database — Migration Checks
    needs: changes
    if: needs.changes.outputs.db == 'true'
    uses: ./.github/workflows/db.yml

  web:
    name: Web — Build & Tests
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/web.yml

  mobile:
    name: Mobile — Code Quality, Tests & Security
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    uses: ./.github/workflows/mobile.yml

  deploy:
    name: Deployment — Configuration Checks
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    uses: ./.github/workflows/deploy.yml

  # Keep the required check stable regardless of which components changed.
  ci-ok:
    if: always()
    needs: [changes, gitleaks, backend, db, web, mobile, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Validate required component checks
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/validate_required_checks.py
