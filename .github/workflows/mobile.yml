name: Mobile

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: mobile

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: mobile/.node-version
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test -- --watch=false
      - run: npx expo install --check
      - run: npx expo-doctor@1.21.5
      - run: npm run config:check
      - run: npm run build
      - name: Validate Docker environment
        run: |
          docker build -t epickem-mobile .
          docker run --rm epickem-mobile

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: mobile/.node-version
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Audit all dependencies
        run: npm audit --audit-level=moderate
      - name: Audit production dependency tree
        if: ${{ !cancelled() }}
        run: npm audit --omit=dev --audit-level=moderate
