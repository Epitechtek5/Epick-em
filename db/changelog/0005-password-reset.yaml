databaseChangeLog:
  - changeSet:
      id: 0005-password-reset
      author: epickem
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: email
                  type: varchar(254)
                  remarks: Adresse e-mail (facultative), en minuscules ; sert à réinitialiser le mot de passe
        - sql:
            sql: CREATE UNIQUE INDEX users_email_key ON users (email)
            rollback: DROP INDEX users_email_key
        - createTable:
            tableName: password_reset_tokens
            remarks: Jetons de réinitialisation du mot de passe (seule l'empreinte est stockée)
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_password_reset_tokens_user
                    references: users(id)
                    deleteCascade: true
              - column:
                  name: token_hash
                  type: char(64)
                  remarks: SHA-256 du jeton, en hexadécimal
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: password_reset_tokens_token_hash_key
              - column:
                  name: expires_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: used_at
                  type: timestamptz
                  remarks: Renseigné quand le jeton est utilisé, ou remplacé par une nouvelle demande
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - createIndex:
            tableName: password_reset_tokens
            indexName: password_reset_tokens_user_id_idx
            columns:
              - column:
                  name: user_id
      rollback:
        - dropTable:
            tableName: password_reset_tokens
        - dropColumn:
            tableName: users
            columnName: email
