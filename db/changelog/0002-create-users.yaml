databaseChangeLog:
  - changeSet:
      id: 0002-create-users
      author: Quentin Tennerel
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_users
              - column:
                  name: username
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_users_username
              # Hash complet au format PHC (ex. $argon2id$…), jamais le mot de passe en clair.
              - column:
                  name: password_hash
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: role_id
                  type: SMALLINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_users_role
                    references: roles(id)
        - createIndex:
            tableName: users
            indexName: idx_users_role_id
            columns:
              - column:
                  name: role_id
      rollback:
        - dropTable:
            tableName: users
